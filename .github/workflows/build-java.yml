name: pipeline-ci

on:
  pull_request:
    branches:
      - main
      - master
    
permissions:
  contents: read
  packages: write

jobs:
  build: 
    name: build-app 
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x ./gradlew

      - name: Build with Gradle (Skip Tests)
        run: ./gradlew build -x test

  test:
    name: test-app
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x ./gradlew

      - name: Start PostgreSQL container for tests
        run: |
          docker run -d \
            --name postgres \
            --env POSTGRES_DB="${{ secrets.DB_NAME }}" \
            --env POSTGRES_USER="${{ secrets.DB_USER }}" \
            --env POSTGRES_PASSWORD="${{ secrets.DB_PASSWORD }}" \
            -p 5434:5432 \
            postgres:16-alpine

          echo "Esperando a que PostgreSQL esté listo..."
          until docker exec postgres pg_isready -U "${{ secrets.DB_USER }}"; do
            sleep 2
          done
          sleep 3
          echo "¡PostgreSQL está listo y aceptando conexiones!"

      - name: Run Tests with GitHub Secrets
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5434/${{ secrets.DB_NAME }}
          SPRING_DATASOURCE_USERNAME: ${{ secrets.DB_USER }}
          SPRING_DATASOURCE_PASSWORD: ${{ secrets.DB_PASSWORD }}
          SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.PostgreSQLDialect
        run: ./gradlew test

  docker:
    name: build-docker-image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:latest